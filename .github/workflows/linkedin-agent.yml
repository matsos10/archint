name: LinkedIn agent

on:
  schedule:
    - cron: "17 7 * * *" # tous les jours à 07:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rédiger sans publier"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: linkedin-agent

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node agent.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "linkedin-agent: post du $(date -u +%F)" && git push)
