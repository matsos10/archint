<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemática da Eva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#2b2d42; --muted:#6c6f85; --line:#eadfce;
  --pri:#6c5ce7; --pri2:#a29bfe; --ok:#1e9e5a; --okbg:#e3f8ec; --bad:#e0384f; --badbg:#fde7eb;
  --star:#f7b731; --shade:#ff9f43;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding:16px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1{font-size:30px;margin:4px 0 2px;font-weight:900}
h2{font-size:20px;margin:24px 0 10px;font-weight:900}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(80,60,20,.06)}
.hero{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.count-down{background:var(--pri);color:#fff;border-radius:16px;padding:10px 14px;font-weight:800;text-align:center}
.count-down b{display:block;font-size:22px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:900;font-size:19px;text-align:center;background:var(--pri);color:#fff;box-shadow:0 4px 0 #4b3fc4;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4b3fc4}
.btn small{display:block;font-weight:700;font-size:14px;opacity:.9}
.btn.orange{background:#ff7a59;box-shadow:0 4px 0 #d9573a}
.btn.green{background:#20bf6b;box-shadow:0 4px 0 #168a4c}
.btn.red{background:#eb3b5a;box-shadow:0 4px 0 #b52640}
.btn:disabled{background:#cfcbe0;box-shadow:0 4px 0 #b4b0c8;cursor:default}
.btn.ghostbtn{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.topic{background:#fff;border-radius:18px;padding:14px;text-align:left;box-shadow:0 3px 0 var(--line);position:relative;border:3px solid transparent}
.topic.sug{border-color:var(--star)}
.topic .ic{font-size:28px}
.topic .nm{font-weight:900;font-size:17px;margin-top:2px}
.topic .ds{font-size:13px;color:var(--muted);min-height:34px}
.topic .badge{position:absolute;top:10px;right:10px;background:var(--star);color:#5a3d00;font-size:12px;font-weight:900;padding:2px 8px;border-radius:999px}
.meter{height:10px;background:#f1eadf;border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px}
.lvl{font-size:13px;font-weight:800;margin-top:4px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{height:42px;padding:0 14px;border-radius:999px;background:#fff;font-size:16px;font-weight:900;box-shadow:0 2px 0 var(--line);flex:none}
.pbar{flex:1;height:16px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:99px;transition:width .3s}
.cnt{font-weight:900;min-width:52px;text-align:right}
.tag{display:inline-block;color:#fff;font-weight:900;font-size:14px;padding:4px 12px;border-radius:999px}
.prompt{font-size:22px;font-weight:800;margin:14px 0 6px}
.visual{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:14px 0;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.choice{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--line);min-height:60px}
.choice:hover:not(:disabled){border-color:var(--pri2)}
.choice.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.choice.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.choice svg{display:block;margin:0 auto;max-width:100%;height:auto}
.inrow{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.inp{width:170px;font:inherit;font-size:30px;font-weight:900;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pri)}
.inp.ok{border-color:var(--ok);background:var(--okbg)}
.inp.bad{border-color:var(--bad);background:var(--badbg)}
.unit{font-weight:800;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:14px auto 0}
.pad button{background:#fff;border-radius:14px;padding:12px 0;font-size:24px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:18px}
.fb.ok{background:var(--okbg);color:#14663b}
.fb.bad{background:var(--badbg);color:#8e1d2f}
.fb b.t{font-size:21px;display:block;margin-bottom:4px}
.fb .btn{margin-top:12px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:900}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.vert{display:grid;--cw:48px;gap:4px 2px;justify-content:center;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;margin:12px auto}
.vert .d{text-align:center;height:48px;line-height:48px}
.vert .op{color:var(--pri)}
.vert .bar{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:2px 0}
.vert .carry{text-align:center;font-size:18px;color:var(--bad);height:22px;line-height:22px}
.vert .cell{height:56px;border:3px dashed #d8ccb8;border-radius:10px;background:#fff;font-size:32px;font-weight:900;padding:0}
.vert .cell.sel{border:3px solid var(--pri);background:#f4efff}
.vert .cell.ok{border:3px solid var(--ok);background:var(--okbg);color:var(--ok)}
.vert .cell.bad{border:3px solid var(--bad);background:var(--badbg);color:var(--bad)}
.vert .res{color:var(--ok)}
.fb .vert{--cw:36px;font-size:26px;margin:4px 0 10px;justify-content:start}
.fb .vert .d{height:36px;line-height:36px}
.vert .lab{font-size:15px;font-weight:800;color:var(--muted);align-self:center;padding-left:8px;white-space:nowrap}
.hint{font-size:15px;font-weight:800;color:var(--muted);text-align:center;margin-top:6px}
.box{display:inline-block;min-width:40px;border:3px dashed var(--pri);border-radius:8px;text-align:center;color:var(--pri)}
table.cal{border-collapse:collapse;background:#fff;font-weight:800;font-size:16px}
table.cal caption{font-weight:900;font-size:18px;padding-bottom:6px;text-transform:capitalize}
table.cal th,table.cal td{width:42px;height:36px;text-align:center;border:2px solid var(--line)}
table.cal th{background:#f4efff;font-size:13px}
table.cal td.hl{background:#ffe8c7}
.picto{border-collapse:collapse;background:#fff;font-size:16px}
.picto td{border:2px solid var(--line);padding:6px 10px;font-weight:800}
.picto td.sy{font-size:24px;letter-spacing:2px;min-width:180px}
.legend{font-weight:800;margin-top:8px;text-align:center}
.res{text-align:center}
.res .big-score{font-size:56px;font-weight:900;margin:6px 0}
.res .stars{font-size:38px;letter-spacing:4px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line);font-weight:700}
.list li:last-child{border-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row>*{flex:1;min-width:180px}
.settings{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.settings button{background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (max-width:480px){
  .prompt{font-size:20px}
  table.cal th,table.cal td{width:36px;height:32px}
  .picto td.sy{min-width:120px;font-size:20px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Matemática da Eva — 3.º ano · teste de 26 de outubro
   Temas: cálculo, ordinais, numeração decimal, frações,
   problemas, calendário, horas, área e gráficos.
   O progresso fica guardado no navegador (localStorage).
   ========================================================= */

const NAME = 'Eva';
const TEST_DATE = new Date(2026, 9, 26);
const KEY = 'eva-matematica-3ano-v1';
const PROB_TRIES = 3;
const FRIEND = 'Margarida';

/* ---------- utilidades ---------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');
const N = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); // 4 582
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const BOX = '<span class="box">?</span>';
const todayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

function numQ(prompt, answer, explain, opts = {}) {
  return { kind: 'num', prompt, answer, explain, visual: opts.visual || '', unit: opts.unit || '' };
}
function mcQ(prompt, correct, distractors, explain, opts = {}) {
  correct = String(correct);
  const uniq = [...new Set(distractors.map(String))].filter(d => d !== correct);
  const choices = shuffle([correct, ...shuffle(uniq).slice(0, (opts.n || 4) - 1)]);
  return { kind: 'mc', prompt, choices, answer: choices.indexOf(correct), explain, visual: opts.visual || '' };
}

/* ---------- números por extenso ---------- */
const U = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'];
const D = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const C = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function words(n) {
  if (n < 20) return U[n];
  if (n < 100) { const u = n % 10; return D[Math.floor(n / 10)] + (u ? ' e ' + U[u] : ''); }
  if (n < 1000) { if (n === 100) return 'cem'; const r = n % 100; return C[Math.floor(n / 100)] + (r ? ' e ' + words(r) : ''); }
  const m = Math.floor(n / 1000), r = n % 1000;
  const s = m === 1 ? 'mil' : words(m) + ' mil';
  if (!r) return s;
  return s + (r < 100 || r % 100 === 0 ? ' e ' : ' ') + words(r);
}
const OU = ['','primeiro','segundo','terceiro','quarto','quinto','sexto','sétimo','oitavo','nono'];
const OD = ['','décimo','vigésimo','trigésimo','quadragésimo','quinquagésimo','sexagésimo','septuagésimo','octogésimo','nonagésimo'];
function ordWords(n) {
  if (n === 100) return 'centésimo';
  return [OD[Math.floor(n / 10)], OU[n % 10]].filter(Boolean).join(' ');
}
const FRN = {2:['meio','meios'],3:['terço','terços'],4:['quarto','quartos'],5:['quinto','quintos'],6:['sexto','sextos'],7:['sétimo','sétimos'],8:['oitavo','oitavos'],9:['nono','nonos'],10:['décimo','décimos']};
const fracName = (k, n) => `${words(k)} ${k === 1 ? FRN[n][0] : FRN[n][1]}`;

const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MDAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
const WD = ['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
const WDP = ['segundas-feiras','terças-feiras','quartas-feiras','quintas-feiras','sextas-feiras','sábados','domingos'];
const WDS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const HW = ['','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze'];
const fmtT = t => { t = ((t % 1440) + 1440) % 1440; return `${Math.floor(t / 60)}h${pad2(t % 60)}`; };
const fmt12 = t => { t = ((t % 720) + 720) % 720; return `${Math.floor(t / 60) || 12}h${pad2(t % 60)}`; };
const fmtDur = d => { const h = Math.floor(d / 60), m = d % 60; return h && m ? `${h} h ${m} min` : h ? `${h} h` : `${m} min`; };

/* ---------- desenhos (SVG / HTML) ---------- */
function fracSVG(n, k, shape) {
  const fill = i => i < k ? 'var(--shade)' : '#fff';
  if (shape === 'pie') {
    const cx = 80, cy = 80, r = 70; let p = '';
    for (let i = 0; i < n; i++) {
      const a0 = (-90 + i * 360 / n) * Math.PI / 180, a1 = (-90 + (i + 1) * 360 / n) * Math.PI / 180;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      p += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${360 / n > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill(i)}" stroke="#2b2d42" stroke-width="3"/>`;
    }
    return `<svg viewBox="0 0 160 160" width="170">${p}</svg>`;
  }
  const w = 280, h = 70, cw = w / n; let p = '';
  for (let i = 0; i < n; i++) p += `<rect x="${5 + i * cw}" y="5" width="${cw}" height="${h}" fill="${fill(i)}" stroke="#2b2d42" stroke-width="3"/>`;
  return `<svg viewBox="0 0 290 80" width="290">${p}</svg>`;
}

function clockSVG(h, m, o = {}) {
  const r1 = x => Math.round(x * 10) / 10, P = (deg, r) => `${r1(100 + r * Math.sin(deg * Math.PI / 180))},${r1(100 - r * Math.cos(deg * Math.PI / 180))}`;
  let s = `<svg viewBox="0 0 200 ${o.label ? 230 : 200}" width="${o.w || 210}" font-family="Nunito,sans-serif"><circle cx="100" cy="100" r="92" fill="#fff" stroke="#2b2d42" stroke-width="6"/>`;
  if (o.sector) {
    const [a, b] = o.sector;
    s += b - a >= 60 ? '<circle cx="100" cy="100" r="88" fill="#dcd7ff"/>'
      : `<path d="M100,100 L${P(a * 6, 88)} A88,88 0 ${b - a > 30 ? 1 : 0} 1 ${P(b * 6, 88)} Z" fill="#dcd7ff"/>`;
  }
  let big = '', small = '';
  for (let i = 0; i < 60; i++) { if (i % 5) small += `M${P(i * 6, 83)}L${P(i * 6, 88)}`; else big += `M${P(i * 6, 78)}L${P(i * 6, 88)}`; }
  s += `<path d="${small}" stroke="#2b2d42" stroke-width="1"/><path d="${big}" stroke="#2b2d42" stroke-width="3"/><g text-anchor="middle" font-size="20" font-weight="800" fill="#2b2d42">`;
  for (let i = 1; i <= 12; i++) { const [x, y] = P(i * 30, 64).split(','); s += `<text x="${x}" y="${r1(+y + 7)}">${i}</text>`; }
  s += `</g><path d="M100,100L${P(((h % 12) + m / 60) * 30, 44)}" stroke="#e0384f" stroke-width="9" stroke-linecap="round"/>`;
  s += `<path d="M100,100L${P(m * 6, 72)}" stroke="#6c5ce7" stroke-width="5" stroke-linecap="round"/>`;
  if (o.sec !== undefined) s += `<path d="M100,100L${P(o.sec * 6, 80)}" stroke="#ff9f43" stroke-width="2"/>`;
  s += '<circle cx="100" cy="100" r="7" fill="#2b2d42"/>';
  if (o.label) s += `<text x="100" y="224" text-anchor="middle" font-size="17" font-weight="900" fill="#2b2d42">${o.label}</text>`;
  return s + '</svg>';
}
function calHTML(month, hl) {
  const first = (new Date(2026, month, 1).getDay() + 6) % 7, len = MDAYS[month];
  let h = `<table class="cal"><caption>${MONTHS[month]} 2026</caption><tr>${WDS.map(d => `<th>${d}</th>`).join('')}</tr><tr>`;
  for (let i = 0; i < first; i++) h += '<td></td>';
  for (let d = 1; d <= len; d++) {
    h += `<td${d === hl ? ' class="hl"' : ''}>${d}</td>`;
    if ((first + d) % 7 === 0 && d < len) h += '</tr><tr>';
  }
  const rest = (7 - (first + len) % 7) % 7;
  for (let i = 0; i < rest; i++) h += '<td></td>';
  return h + '</tr></table>';
}

function polyomino(n, W, H) {
  const s = new Set([`${rnd(1, W - 2)},${rnd(1, H - 2)}`]); let g = 0;
  while (s.size < n && g++ < 2000) {
    const [x, y] = pick([...s]).split(',').map(Number), [dx, dy] = pick([[1,0],[-1,0],[0,1],[0,-1]]);
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < W && ny < H) s.add(`${nx},${ny}`);
  }
  return [...s].map(c => c.split(',').map(Number));
}
function gridSVG(cells, W, H, color, label) {
  const c = 28, o = 4; let s = `<svg viewBox="0 0 ${W * c + 2 * o} ${H * c + 2 * o + (label ? 30 : 0)}" width="${W * c + 2 * o}">`;
  for (const [x, y] of cells) s += `<rect x="${o + x * c}" y="${o + y * c}" width="${c}" height="${c}" fill="${color}"/>`;
  for (let x = 0; x <= W; x++) s += `<line x1="${o + x * c}" y1="${o}" x2="${o + x * c}" y2="${o + H * c}" stroke="#c9bfae" stroke-width="1.5"/>`;
  for (let y = 0; y <= H; y++) s += `<line x1="${o}" y1="${o + y * c}" x2="${o + W * c}" y2="${o + y * c}" stroke="#c9bfae" stroke-width="1.5"/>`;
  if (label) s += `<text x="${(W * c) / 2 + o}" y="${H * c + 2 * o + 22}" text-anchor="middle" font-size="20" font-weight="900" fill="#2b2d42" font-family="Nunito,sans-serif">${label}</text>`;
  return s + '</svg>';
}

const CHART_THEMES = [
  { t: 'Fruto preferido dos alunos da turma', who: 'alunos', cats: [['🍎','Maçã'],['🍌','Banana'],['🍊','Laranja'],['🍓','Morango'],['🍇','Uvas']] },
  { t: 'Desporto preferido', who: 'alunos', cats: [['⚽','Futebol'],['🏊','Natação'],['🤸','Ginástica'],['🏀','Basquete'],['🚴','Ciclismo']] },
  { t: 'Animal de estimação preferido', who: 'alunos', cats: [['🐶','Cão'],['🐱','Gato'],['🐰','Coelho'],['🐟','Peixe'],['🐦','Pássaro']] },
  { t: 'Livros lidos na semana da leitura', who: 'livros', cats: [['📘','3.º A'],['📗','3.º B'],['📙','3.º C'],['📕','3.º D']] },
];
const BAR_COLORS = ['#ff7a59','#f7b731','#20bf6b','#45aaf2','#a55eea'];
function barSVG(title, cats, vals) {
  const W = 360, H = 250, l = 34, b = 46, t = 30, max = 10, ch = H - b - t, bw = (W - l - 10) / cats.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" font-family="Nunito,sans-serif">`;
  s += `<text x="${W / 2}" y="18" text-anchor="middle" font-size="15" font-weight="900" fill="#2b2d42">${title}</text>`;
  for (let v = 0; v <= max; v++) {
    const y = t + ch - v * ch / max;
    s += `<line x1="${l}" y1="${y}" x2="${W - 6}" y2="${y}" stroke="${v ? '#eee4d4' : '#2b2d42'}" stroke-width="${v ? 1 : 2}"/>`;
    s += `<text x="${l - 6}" y="${y + 4}" text-anchor="end" font-size="11" font-weight="800" fill="#6c6f85">${v}</text>`;
  }
  cats.forEach(([ic, nm], i) => {
    const x = l + i * bw + bw * .18, w = bw * .64, hgt = vals[i] * ch / max;
    s += `<rect x="${x}" y="${t + ch - hgt}" width="${w}" height="${hgt}" rx="4" fill="${BAR_COLORS[i % 5]}"/>`;
    s += `<text x="${x + w / 2}" y="${t + ch + 20}" text-anchor="middle" font-size="16">${ic}</text>`;

/* ---------- memória ---------- */
function freshState() {
  const topics = {}; Object.keys(T).forEach(k => topics[k] = { a: 0, c: 0, recent: [] });
  return { stars: 0, answered: 0, correct: 0, topics, mistakes: [], history: [], days: [], sound: true };
}
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch (e) { S = freshState(); }
  const f = freshState();
  for (const k in f) if (S[k] === undefined) S[k] = f[k];
  for (const k in T) if (!S.topics[k]) S.topics[k] = { a: 0, c: 0, recent: [] };
}
function save() {
  for (let i = 0; i < 8; i++) {
    try { localStorage.setItem(KEY, JSON.stringify(S)); return; } catch (e) { if (!S.mistakes.length) return; S.mistakes.splice(0, 10); }
  }
}
const qKey = q => q.topic + '|' + q.prompt + '|' + q.visual;
function mastery(k) { const r = S.topics[k].recent; return r.length ? Math.round(100 * r.reduce((a, b) => a + b, 0) / r.length) : null; }
function streak() {
  const set = new Set(S.days); let d = new Date(), n = 0;
  if (!set.has(todayStr(d))) d.setDate(d.getDate() - 1);
  while (set.has(todayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function suggestion() {
  let best = null, bv = 101;
  for (const k in T) { const m = mastery(k); const v = m === null ? -1 : m; if (v < bv) { bv = v; best = k; } }
  return bv >= 80 ? null : best;
}

/* ---------- som ---------- */
let AC;
function beep(ok) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [300, 220];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * 0.12;
      o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) {}
}
function confetti() {
  const em = ['🎉','⭐','🌟','🎈','✨','🏆'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div'); s.className = 'confetti'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 3600);
  }
}

/* ---------- sessões ---------- */
const app = document.getElementById('app');
let ses = null;

function makeQ(topic, seen) {
  let q;
  for (let i = 0; i < 25; i++) { q = GEN[topic](); q.topic = topic; if (!seen.has(qKey(q))) break; }
  seen.add(qKey(q)); return q;
}
function start(mode, topic) {
  const seen = new Set(); let qs = [];
  if (mode === 'topic') for (let i = 0; i < 10; i++) qs.push(makeQ(topic, seen));
  else if (mode === 'quick') for (let i = 0; i < 10; i++) qs.push(makeQ(pick(Object.keys(T)), seen));
  else if (mode === 'test') {
    const plan = { calc: 3, ord: 2, num: 3, frac: 2, prob: 3, cal: 2, horas: 2, area: 1, graf: 2 };
    for (const k in plan) for (let i = 0; i < plan[k]; i++) qs.push(makeQ(k, seen));
  } else if (mode === 'review') {
    qs = shuffle(S.mistakes).slice(0, 10).map(q => q.kind === 'mc' ? reshuffle(q) : { ...q });
  }
  ses = { mode, topic, qs, i: 0, ok: 0, res: [], done: false };
  renderQ();
}
function reshuffle(q) {
  const right = q.choices[q.answer], choices = shuffle(q.choices);
  return { ...q, choices, answer: choices.indexOf(right) };
}
const MODE_NAME = { topic: 'Treino', quick: 'Treino rápido', test: 'Teste de treino', review: 'Rever erros' };

  else if (q.kind === 'mc') ans = `<div class="choices">${q.choices.map((c, i) => `<button class="choice" data-i="${i}">${c}</button>`).join('')}</div>`;
  else ans = `<div class="inrow"><input id="inp" class="inp" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Resposta">${q.unit ? `<span class="unit">${q.unit}</span>` : ''}</div>${q.topic === 'prob' ? `<div class="hint">Tens ${PROB_TRIES} tentativas.</div>` : ''}${PAD}`;
  app.innerHTML = `
    <div class="top"><button class="x" id="quit" aria-label="Voltar ao início">🏠 Início</button>

  if (q.kind === 'mc') app.querySelectorAll('.choice').forEach(b => b.onclick = () => check(Number(b.dataset.i)));
  else if (q.kind === 'vert') {
    ses.rows = vertRows(q.vert).map(() => Array(q.vert.w).fill('')); ses.r = 0; ses.sel = q.vert.w - 1; paintCells();
    app.querySelectorAll('.vert .cell').forEach(b => b.onclick = () => { if (ses.done) return; ses.r = Number(b.dataset.r); ses.sel = Number(b.dataset.c); paintCells(); });
    app.querySelectorAll('.pad button').forEach(b => b.onclick = () => vertKey(b.dataset.k));
  } else {
    const inp = document.getElementById('inp');
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, ''); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); submitNum(); } });
    app.querySelectorAll('.pad button').forEach(b => b.onclick = () => {
      if (ses.done) return;
      const k = b.dataset.k;
      if (k === 'del') inp.value = inp.value.slice(0, -1);
      else if (k === 'ok') submitNum();
      else if (inp.value.length < 6) inp.value += k;
    });
    if (matchMedia('(pointer:fine)').matches) inp.focus();
  }
}
function paintCells() {
  app.querySelectorAll('.vert .cell').forEach(b => {
    const r = Number(b.dataset.r), c = Number(b.dataset.c);
    b.textContent = ses.rows[r][c]; b.classList.toggle('sel', r === ses.r && c === ses.sel && !ses.done);
  });
}
function vertKey(k) {
  if (ses.done) return;
  if (k === 'ok') return submitVert();
  const row = ses.rows[ses.r], w = row.length;
  if (k === 'del') {
    if (row[ses.sel] !== '') row[ses.sel] = '';
    else if (ses.sel < w - 1) row[++ses.sel] = '';
    else if (ses.r > 0) { const pr = ses.rows[--ses.r], f = pr.findIndex(x => x !== ''); ses.sel = f < 0 ? w - 1 : f; pr[ses.sel] = ''; }
  } else {
    row[ses.sel] = k; if (ses.sel > 0) ses.sel--;
    const exp = vertRows(ses.qs[ses.i].vert);
    if (ses.r < exp.length - 1 && row.filter(x => x !== '').length >= String(exp[ses.r]).length) { ses.r++; ses.sel = w - 1; }
  }
  paintCells();
}
function submitVert() {
  const vals = [];
  for (const c of ses.rows) {
    const first = c.findIndex(x => x !== '');
    if (first < 0 || c.slice(first).some(x => x === '')) {
      document.getElementById('fb').innerHTML = `<div class="fb bad pop">${ses.rows.length > 1 ? 'Preenche todas as linhas da conta.' : 'Falta preencher um quadrado no meio do resultado.'}</div>`;
      return;
    }
    vals.push(Number(c.join('')));
  }
  document.getElementById('fb').innerHTML = '';
  ses.vals = vals;
  const q = ses.qs[ses.i], exp = vertRows(q.vert);
  check(vals.every((x, i) => x === exp[i]) ? q.answer : -1);
}
function submitNum() {
  const inp = document.getElementById('inp');
  if (ses.done || !inp.value) return;
  check(Number(inp.value));
}
function check(given) {
  if (ses.done) return;
  const q = ses.qs[ses.i], ok = given === q.answer;
  if (!ok && q.topic === 'prob' && ses.tries < PROB_TRIES - 1) {
    ses.tries++; beep(false);
    const left = PROB_TRIES - ses.tries, inp = document.getElementById('inp');
    document.getElementById('fb').innerHTML = `<div class="fb bad pop"><b class="t">${N(given)} não está certo. Tenta outra vez! 🤔</b>Ainda tens <b>${left}</b> tentativa${left > 1 ? 's' : ''}. Lê o problema outra vez com atenção.</div>`;
    inp.value = ''; if (matchMedia('(pointer:fine)').matches) inp.focus();
    return;
  }
  ses.done = true;
  if (q.kind === 'mc') app.querySelectorAll('.choice').forEach((b, i) => { b.disabled = true; if (i === q.answer) b.classList.add('ok'); else if (i === given) b.classList.add('bad'); });
  else if (q.kind === 'vert') { paintCells(); const exp = vertRows(q.vert); app.querySelectorAll('.vert .cell').forEach(b => { const r = Number(b.dataset.r); b.disabled = true; if (b.textContent) b.classList.add(ses.vals[r] === exp[r] ? 'ok' : 'bad'); }); }
  else { const inp = document.getElementById('inp'); inp.disabled = true; inp.classList.add(ok ? 'ok' : 'bad'); }
  record(q, ok);
  beep(ok);
  const right = q.kind === 'mc' ? q.choices[q.answer] : `${N(q.answer)}${q.unit ? ' ' + q.unit : ''}`;
  const cheers = ['Muito bem! 🎉', 'Boa, ' + NAME + '! ⭐', 'Excelente! 🌟', 'Certíssimo! 💪', 'Fantástico! 🚀'];
  const oops = ['Quase! Vamos ver 🤔', 'Não faz mal, aprende-se assim 💡', 'Ups! Olha a explicação 👀'];
  const last = ses.i === ses.qs.length - 1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'} pop">
    <b class="t">${ok ? (ses.tries ? `Muito bem! Conseguiste à ${ses.tries + 1}.ª tentativa! 🎉` : pick(cheers)) : pick(oops)}</b>
    ${ok ? '' : q.kind === 'vert' && q.vert.parts ? 'Vê a conta resolvida:<br>' : right.includes('<svg') ? 'A resposta certa é o relógio a verde.<br>' : `A resposta certa é: <b>${right}</b><br>`}${q.explain}
    <button class="btn ${ok ? 'green' : ''}" id="next">${last ? 'Ver resultado 🏁' : 'Continuar ➜'}</button></div>`;
  const nb = document.getElementById('next'); nb.onclick = next; nb.focus({ preventScroll: true });
  document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function record(q, ok) {
  const t = S.topics[q.topic];
  t.a++; t.c += ok ? 1 : 0; t.recent.push(ok ? 1 : 0); if (t.recent.length > 10) t.recent.shift();
  S.answered++; if (ok) { S.correct++; S.stars++; ses.ok++; }
  ses.res.push({ topic: q.topic, ok });
  const k = qKey(q), idx = S.mistakes.findIndex(m => qKey(m) === k);
  if (!ok && idx < 0) { S.mistakes.push(q); if (S.mistakes.length > 60) S.mistakes.shift(); }
  if (ok && idx >= 0 && ses.mode === 'review') S.mistakes.splice(idx, 1);
  const td = todayStr(); if (!S.days.includes(td)) S.days.push(td);
  save();
}
function next() {
  if (!ses.done) return;
  ses.i++;
  if (ses.i < ses.qs.length) { renderQ(); window.scrollTo({ top: 0 }); }
  else results();
}

function results() {
  const n = ses.qs.length, ok = ses.ok, pct = Math.round(100 * ok / n);
  S.history.unshift({ d: new Date().toISOString(), m: ses.mode, t: ses.topic || null, ok, n }); S.history = S.history.slice(0, 30); save();
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  const msg = pct === 100 ? `Perfeito, ${NAME}! Sabes tudo para o teste! 🏆` : pct >= 80 ? 'Muito bom trabalho! Continua assim! 🌟' : pct >= 60 ? 'Bom trabalho! Mais um bocadinho de treino e fica perfeito. 💪' : 'Estás a aprender! Revê os erros e tenta outra vez. 💡';
  const by = {}; ses.res.forEach(r => { by[r.topic] = by[r.topic] || { a: 0, c: 0 }; by[r.topic].a++; by[r.topic].c += r.ok ? 1 : 0; });
  app.innerHTML = `<div class="card res pop">
    <div class="muted" style="font-weight:800">${MODE_NAME[ses.mode]}${ses.topic ? ' · ' + T[ses.topic].name : ''}</div>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <div class="big-score">${ok} / ${n}</div>
    <div style="font-weight:800;font-size:20px">${msg}</div>
    <div class="muted" style="margin-top:6px">Ganhaste ${ok} estrela${ok === 1 ? '' : 's'} · Total: ⭐ ${S.stars}</div>
  </div>
  ${Object.keys(by).length > 1 ? `<h2>Por tema</h2><div class="card"><ul class="list">${Object.keys(by).map(k => `<li><span>${T[k].icon} ${T[k].name}</span><span>${by[k].c}/${by[k].a} ${by[k].c === by[k].a ? '✅' : ''}</span></li>`).join('')}</ul></div>` : ''}
  <div class="row"><button class="btn ghostbtn" id="home">🏠 Início</button>
    <button class="btn" id="again">🔁 Outra vez</button>
    ${S.mistakes.length ? `<button class="btn red" id="rev">🔍 Rever erros (${S.mistakes.length})</button>` : ''}</div>`;
  if (pct >= 80) confetti();
  const m = ses.mode, tp = ses.topic;
  document.getElementById('home').onclick = home;
  document.getElementById('again').onclick = () => (m === 'review' && !S.mistakes.length) ? home() : start(m, tp);
  const rv = document.getElementById('rev'); if (rv) rv.onclick = () => start('review');
  window.scrollTo({ top: 0 });
}

/* ---------- ecrã inicial ---------- */
function countdown() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = Math.round((TEST_DATE - t) / 86400000);
  if (d > 1) return `Teste de Matemática<b>faltam ${d} dias</b>`;
  if (d === 1) return 'Teste de Matemática<b>é amanhã! 💪</b>';
  if (d === 0) return 'Teste de Matemática<b>é hoje! Boa sorte! 🍀</b>';
  return 'Teste de Matemática<b>26 de outubro ✔</b>';
}
function lvl(m) {
  if (m === null) return ['Ainda não treinado', '#cfc6b8', 0];
  if (m >= 80) return [`Dominado ⭐ ${m}%`, 'var(--ok)', m];
  if (m >= 50) return [`Quase lá! ${m}%`, 'var(--star)', m];
  return [`A treinar ${m}%`, 'var(--bad)', Math.max(m, 4)];
}
function home() {
  ses = null;
  const sug = suggestion(), st = streak(), acc = S.answered ? Math.round(100 * S.correct / S.answered) : 0;
  const hist = S.history.slice(0, 5).map(h => { const d = new Date(h.d); return `<li><span>${MODE_NAME[h.m]}${h.t ? ' · ' + T[h.t].name : ''} <span class="muted">${d.getDate()}/${d.getMonth() + 1} ${pad2(d.getHours())}:${pad2(d.getMinutes())}</span></span><span>${h.ok}/${h.n}</span></li>`; }).join('');
  app.innerHTML = `
  <div class="hero">
    <div><h1>Olá, ${NAME}! 👋</h1><div class="muted" style="font-weight:700">Vamos treinar Matemática do 3.º ano</div></div>
    <div class="count-down">${countdown()}</div>
  </div>
  <div class="chips"><span class="chip">⭐ ${S.stars} estrelas</span><span class="chip">🔥 ${st} dia${st === 1 ? '' : 's'} seguido${st === 1 ? '' : 's'}</span><span class="chip">✅ ${acc}% certas</span></div>
  <div class="big">
    <button class="btn" id="b-test">📝 Teste de treino<small>20 perguntas de todos os temas</small></button>
    <button class="btn orange" id="b-quick">⚡ Treino rápido<small>10 perguntas misturadas</small></button>
    <button class="btn red" id="b-rev" ${S.mistakes.length ? '' : 'disabled'}>🔍 Rever erros<small>${S.mistakes.length ? S.mistakes.length + ' pergunta' + (S.mistakes.length > 1 ? 's' : '') + ' para rever' : 'Sem erros para rever 🎉'}</small></button>
  </div>
  ${DOMAINS.map(dm => `<h2>${dm.name}</h2><div class="topics">${dm.topics.map(k => { const [l, c, w] = lvl(mastery(k)); return `
    <button class="topic${k === sug ? ' sug' : ''}" data-t="${k}">${k === sug ? '<span class="badge">Sugestão</span>' : ''}
      <div class="ic">${T[k].icon}</div><div class="nm">${T[k].name}</div><div class="ds">${T[k].desc}</div>
      <div class="meter"><i style="width:${w}%;background:${c}"></i></div><div class="lvl" style="color:${c === '#cfc6b8' ? 'var(--muted)' : c}">${l}</div>
    </button>`; }).join('')}</div>`).join('')}
  ${hist ? `<h2>Últimos treinos</h2><div class="card"><ul class="list">${hist}</ul></div>` : ''}
  <div class="settings"><button id="b-sound">${S.sound ? '🔊 Som ligado' : '🔇 Som desligado'}</button><button id="b-reset">🗑️ Apagar progresso</button></div>`;
  document.getElementById('b-test').onclick = () => start('test');
  document.getElementById('b-quick').onclick = () => start('quick');
  document.getElementById('b-rev').onclick = () => S.mistakes.length && start('review');
  app.querySelectorAll('.topic').forEach(b => b.onclick = () => start('topic', b.dataset.t));
  document.getElementById('b-sound').onclick = () => { S.sound = !S.sound; save(); home(); };
  document.getElementById('b-reset').onclick = () => { if (confirm('Apagar todo o progresso da ' + NAME + '? Isto não pode ser desfeito.')) { S = freshState(); save(); home(); } };
  window.scrollTo({ top: 0 });
}

document.addEventListener('keydown', e => {
  if (!ses) return;
  if (ses.done && e.key === 'Enter') { e.preventDefault(); next(); return; }
  const q = ses.qs[ses.i];
  if (!ses.done && q && q.kind === 'vert') {
    if (/^[0-9]$/.test(e.key)) vertKey(e.key);
    else if (e.key === 'Backspace') { e.preventDefault(); vertKey('del'); }
    else if (e.key === 'Enter') { e.preventDefault(); vertKey('ok'); }
    return;
  }
  if (!ses.done && q && q.kind === 'mc' && /^[1-4]$/.test(e.key) && Number(e.key) <= q.choices.length) check(Number(e.key) - 1);
});

load();
home();
</script>
